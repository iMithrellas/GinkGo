syntax = "proto3";

package ipc;

option go_package = "github.com/mithrel/ginkgo/internal/ipc/pb";

import "google/protobuf/timestamp.proto";

message Entry {
  string id = 1;
  int64 version = 2;
  string title = 3;
  string body = 4;
  repeated string tags = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string namespace = 8;
  Provenance provenance = 9;
}

message Source {
  string id = 1;
  google.protobuf.Timestamp captured_at = 2;
  string kind = 3;
  string original_text = 4;
  string language = 5;
  string stt_engine = 6;
  string stt_model = 7;
  repeated ImageAttachment images = 8;
}

message ImageAttachment {
  string id = 1;
  string sha256 = 2;
  string media_type = 3;
  int64 size = 4;
  int32 width = 5;
  int32 height = 6;
  google.protobuf.Timestamp captured_at = 7;
  string label = 8;
}

message ContextImage {
  bytes data = 1;
  string media_type = 2;
  int32 width = 3;
  int32 height = 4;
  google.protobuf.Timestamp captured_at = 5;
  string label = 6;
}

message ImageContext {
  string action = 1;
  string namespace = 2;
  repeated ContextImage images = 3;
}

message Provenance {
  repeated Source sources = 1;
}

message NoteAdd { string title = 1; string body = 2; repeated string tags = 3; string namespace = 4; Provenance provenance = 5; }
message NoteEdit { string id = 1; int64 if_version = 2; string title = 3; string body = 4; repeated string tags = 5; string namespace = 6; Provenance provenance = 7; }
message AINote {
  string text = 1;
  string namespace = 2;
  string title = 3;
  string action = 4;
  string note_id = 5;
  repeated string tags = 6;
  string provider = 7;
  google.protobuf.Timestamp deadline = 8;
  repeated ContextImage images = 9;
}
message NoteDelete { string id = 1; string namespace = 2; }
message VoiceTranscribe {
  string audio_path = 1;
  bool save = 2;
  string mode = 3;
  string namespace = 4;
  string title = 5;
  repeated string tags = 6;
  string provider = 7;
  string action = 8;
  string note_id = 9;
  string model = 10;
  string language = 11;
  google.protobuf.Timestamp deadline = 12;
}
message CaptureOptions { string target = 1; int64 silence_timeout = 2; int64 max_duration = 3; int64 start_timeout = 4; double threshold = 5; }
message VoiceControl { string action = 1; string namespace = 2; bool save = 3; string mode = 4; string provider = 5; string title = 6; repeated string tags = 7; string note_id = 8; string model = 9; string language = 10; string note_action = 11; CaptureOptions capture = 12; google.protobuf.Timestamp deadline = 13; string trigger = 14; }
message VoiceStatus { bool enabled = 1; bool active = 2; bool continuous = 3; string state = 4; string namespace = 5; int64 silence_timeout = 6; google.protobuf.Timestamp started_at = 7; int64 segments = 8; string last_note_id = 9; string last_error = 10; string backend = 11; string helper_engine = 12; string requested_provider = 13; string effective_provider = 14; string provider_fallback_reason = 15; }
message Transcript {
  string text = 1;
  string language = 2;
  string engine = 3;
  string model = 4;
}
message NoteShow { string id = 1; string namespace = 2; }

message ListFilter {
  string namespace = 1;
  repeated string tags_any = 2;
  repeated string tags_all = 3;
  google.protobuf.Timestamp since = 4;
  google.protobuf.Timestamp until = 5;
  int32 limit = 6;
  string cursor = 7;
  bool reverse = 8;
  bool include_body = 9;
}

message SearchFTS { string query = 1; ListFilter filter = 2; }
message SearchRegex { string pattern = 1; ListFilter filter = 2; }

message TagList {
  string namespace = 1;
}

message Request {
  oneof cmd {
    NoteAdd note_add = 1;
    NoteEdit note_edit = 2;
    NoteDelete note_delete = 3;
    NoteShow note_show = 4;
    ListFilter note_list = 5;
    SearchFTS note_search_fts = 6;
    SearchRegex note_search_regex = 7;
    SyncRun sync_run = 8;
    QueueRequest queue_list = 9;
    NamespaceList namespace_list = 10;
    TagList tag_list = 11;
    NamespaceDelete namespace_delete = 12;
    AINote ai_note = 13;
    VoiceTranscribe voice_transcribe = 14;
    VoiceControl voice_control = 15;
    ImageContext image_context = 16;
  }
}

message TagStat {
  string tag = 1;
  int32 count = 2;
  string description = 3;
}

message Response {
  bool ok = 1;
  string msg = 2;
  Entry entry = 3;
  repeated Entry entries = 4;
  repeated QueueRemote queue = 5;
  repeated string namespaces = 6;
  repeated TagStat tags = 7;
  Page page = 8;
  string action = 9;
  string fallback_reason = 10;
  Transcript transcript = 11;
  VoiceStatus voice_status = 12;
  string image_status = 13;
}

message Page {
  string next = 1;
  string prev = 2;
}

message RepEvent {
  google.protobuf.Timestamp time = 1;
  string type = 2;
  string id = 3;
  string namespace_id = 4;
  string payload_type = 5;
  bytes payload = 6;
  string signer_id = 7;
  bytes sig = 8;
  string origin_label = 9;
}

message PushBatch {
  repeated RepEvent events = 1;
}

message ItemStatus {
  string id = 1;
  bool ok = 2;
  string msg = 3;
}

message Cursor {
  google.protobuf.Timestamp after = 1;
}

message PushResult {
  repeated ItemStatus items = 1;
  Cursor next = 2;
}

message PullResult {
  repeated RepEvent events = 1;
  Cursor next = 2;
}

message SyncRun {}
message NamespaceList {}
message NamespaceDelete { string namespace = 1; }

message QueueRequest { int32 limit = 1; string remote = 2; }

message QueueEvent {
  google.protobuf.Timestamp time = 1;
  string type = 2;
  string id = 3;
}

message QueueRemote {
  string name = 1;
  string url = 2;
  int64 pending = 3;
  repeated QueueEvent events = 4;
}
